<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f1f0f4" />
  <title>Arquivos editáveis</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <main class="library-shell">
    <header class="library-header">
      <div>
        <p class="eyebrow">ARQUIVOS EDITÁVEIS</p>
        <h1>Escolha um arquivo para editar</h1>
        <p class="library-copy">Os projetos salvos e os modelos disponíveis aparecem abaixo. Clique em um card para continuar a edição.</p>
      </div>
    </header>

    <section class="template-grid" id="templateGrid" aria-label="Arquivos disponíveis para edição"></section>
  </main>

  <template id="templateCard">
    <a class="template-card" href="#">
      <img class="template-preview" alt="" loading="eager" />
      <div class="template-overlay">
        <div class="template-copy">
          <strong class="template-title"></strong>
          <time class="template-date"></time>
        </div>
        <span class="template-action" aria-hidden="true">Editar <svg viewBox="0 0 24 24" role="img"><path d="M8 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
    </a>
  </template>

  <script src="templates.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
