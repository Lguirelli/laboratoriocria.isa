<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f1f0f4" />
  <title>Arquivos editáveis</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <main class="library-shell">
    <header class="library-header brand-only">
      <img class="library-brand-logo" src="assets/modelo2/layer-8.png" alt="Isadora Guirelli · Saúde e Estética Avançada">
    </header>

    <section class="library-group" id="templatesGroup">
      <div class="group-heading"><h2>Modelos</h2><span class="group-count" id="templateCount"></span></div>
      <div class="template-grid" id="templateGrid" aria-label="Modelos disponíveis para edição"></div>
    </section>

    <section class="library-group" id="savedGroup" hidden>
      <div class="group-heading"><h2>Projetos</h2><span class="group-count" id="savedCount"></span></div>
      <div class="template-grid" id="savedGrid" aria-label="Projetos salvos"></div>
    </section>

    <section class="library-group archived-group" id="archivedGroup" hidden>
      <div class="group-heading"><h2>Arquivados</h2><span class="group-count" id="archivedCount"></span></div>
      <div class="template-grid" id="archivedGrid" aria-label="Projetos arquivados"></div>
    </section>
  </main>

  <template id="templateCard">
    <article class="template-card-wrap">
      <a class="template-card" href="#">
        <img class="template-preview" alt="" loading="eager" />
        <div class="template-overlay">
          <div class="template-copy">
            <strong class="template-title"></strong>
            <time class="template-date"></time>
          </div>
          <span class="template-action" aria-hidden="true">Editar <svg viewBox="0 0 24 24" role="img"><path d="M8 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </div>
      </a>
      <div class="card-controls" hidden>
        <button class="card-control archive-btn" type="button" title="Arquivar projeto" aria-label="Arquivar projeto">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4zM3 4h18v4H3zm6 7h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Arquivar</span>
        </button>
        <button class="card-control restore-btn" type="button" title="Restaurar projeto" aria-label="Restaurar projeto" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4zM3 4h18v4H3zm8 7v5m-2-2 2 2 2-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Restaurar</span>
        </button>
        <button class="card-control delete-btn danger" type="button" title="Excluir projeto" aria-label="Excluir projeto">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Excluir</span>
        </button>
      </div>
    </article>
  </template>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="storage.js"></script>
  <script src="project-service.js"></script>
  <script src="templates.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
